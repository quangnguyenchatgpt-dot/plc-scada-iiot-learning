name: Validate learning progress
on:
  push:
    paths:
      - 'learning/**'
      - 'scripts/progress.py'
      - 'tests/test_progress.py'
      - '.github/workflows/progress-tests.yml'
  pull_request:
    paths:
      - 'learning/**'
      - 'scripts/progress.py'
      - 'tests/test_progress.py'
      - '.github/workflows/progress-tests.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/progress.py status
